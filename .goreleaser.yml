version: 2

# The archives are named <binary>_<version>_<os>_<arch>.tar.gz, the names the
# npm and PyPI packaging jobs download, for every platform of rlsbl's
# platform table.
project_name: saferm

builds:
  - main: .
    binary: saferm
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

brews:
  - repository:
      owner: stricttools
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/stricttools/saferm"
    description: "The `rm` replacement that is safe to hand to your AI Agents: deleted files can be restored, know exactly which session deleted a file, when, and why, with the reason being a required flag"
    license: "MIT"
    install: |
      bin.install "saferm"
    test: |
      system "#{bin}/saferm", "--version"
