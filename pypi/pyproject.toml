[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saferm"
version = "0.11.0"
description = "The `rm` replacement that is safe to hand to your AI Agents: deleted files can be restored, know exactly which session deleted a file, when, and why, with the reason being a required flag"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["rm", "safe-delete", "undelete", "trash", "archive", "audit-trail", "cli", "ai-agents", "rlsbl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://smmh.dev/saferm/"
Documentation = "https://smmh.dev/saferm/"
Repository = "https://github.com/stricttools/saferm"
Issues = "https://github.com/stricttools/saferm/issues"
Changelog = "https://github.com/stricttools/saferm/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["saferm"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/todo/",
    "/experiments/",
    "/screenshots/",
    "/stricttools/",
    ".rlsbl/",
    ".rlsbl-monorepo/",
    ".strictmetadata/",
    ".stricttools/",
    ".claude/",
    ".selfdoc/",
    ".strictcli/",
    "CLAUDE.md",
    "AGENTS.md",
    ".env*",
    "*.local-only",
]

[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "experiments", "screenshots"]

[project.scripts]
saferm = "saferm:main"
