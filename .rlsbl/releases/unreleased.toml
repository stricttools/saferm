# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "A fast list on large archives, with a default limit of 50, --limit, --since, and an index-driven --path; a new usage report of the archive's disk use; and purge selecting and sizing only what it destroys."
# Optional context explaining why these changes were made
context = """
On an archive of about 25,000 records, a cold `saferm list` took 36 to 191 seconds because every multi-row query read the database backward, which defeats read-ahead on a copy-on-write, compressing filesystem. Queries now read oldest-first and reverse in memory, `--path` reads only the matching part of the path index, and a bare `list` shows the newest 50 entries with a line saying how many are hidden.

`list --json` now answers with an object, `{"total", "rows"}`, instead of a bare array, so a consumer reads the rows from `rows`. The Go module path is now `github.com/stricttools/saferm`.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go", "npm", "pypi"]
exclude = []
