# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "infra"
# Short description of this release (required)
description = "Publish-workflow fix so the npm wrapper stops racing the binary upload."
# Optional context explaining why these changes were made
context = """
0.8.0's publish job for the npm wrapper failed and had to be retried. The job
runs `npm ci`, which runs the wrapper's own postinstall, which downloads the
platform binary from the GitHub Release for the version in package.json -- an
asset the goreleaser job in the same workflow was still uploading. The retry
passed only because by then it had finished, so whether a release publishes to
npm was decided by a race.

`npm ci --ignore-scripts` removes the race outright: the wrapper has no
dependencies, and running a package's install hooks was never part of preparing
it for publication. Infrastructure only -- no code, no behaviour, nothing a
0.8.0 user needs to read.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go", "npm", "pypi"]
exclude = []
release_commit = "25cd3cc41fc0a33eb9f5790e26eeab15c52e142b"

[released_trees]
"." = "0eb74cbd355e1fc7c99e57eb936684f50621c108"
