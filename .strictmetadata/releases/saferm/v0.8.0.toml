# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "One consent gate on purge, a --quiet flag that works, and a dry run that no longer creates the directory it promises not to touch."
# Optional context explaining why these changes were made
context = """
saferm shipped 0.7.1 with two consent gates stacked on `purge`: the CLI
framework's `consequential` approval, and saferm's own `[y/N]` prompt behind it.
An approved non-interactive `saferm --approve-consequential purge --all` reached
the second gate, read EOF, and aborted -- one operation asking twice, with the
second ask unanswerable exactly where the first had already been given. The
prompt and its `--skip-confirmation`/`-f` escape hatch are gone. What the prompt
was actually for survives it: the per-record listing of everything about to be
destroyed now prints unconditionally after consent and before the first removal.

Two other flags stopped lying in the same pass. `--quiet` was accepted and
ignored -- saferm read it nowhere -- and now suppresses summaries and progress
while never touching the outputs that ARE the command: `list`, `info`, the
dry-run previews, and purge's destruction listing. And `--dry-run` used to
create saferm's whole state directory on a fresh machine on its way to promising
it would touch nothing; that creation is now minted on the effects handle, so it
is named in the would-do log and performed only in a real run. Following that
thread turned up its mirror image: the read-only commands, which correctly
create nothing, answered "what have I deleted?" on a fresh machine with SQLite's
"unable to open database file". An absent archive is an empty one, and they say
so now.

Two entries in this release's changelog described designs that were superseded
before they ever shipped -- a blanket approval flag and a prompt in front of
every destructive command -- and were rewritten to the end state that ships.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go", "npm", "pypi"]
exclude = []
release_commit = "37ba19c64837f74efc810cd8d11eaf2a9c9767c7"

