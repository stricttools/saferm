# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Adopt strictcli v0.21.0 config safety: malformed config.toml is now a hard error with parse position (was a silent warning), unknown config keys are rejected, and diverging CLI/config values for --archive-dir/--db-path conflict instead of silently letting the CLI win."
# Optional context explaining why these changes were made
context = """
saferm previously pinned strictcli v0.17.0, where a broken config.toml printed a
warning and ran with default paths -- silent degradation that could send deletions
to the wrong archive without the user noticing. This release bumps to strictcli
v0.21.0 and deliberately adopts its config-safety primitives:

- Malformed config is a hard error (exit 1) with parse position. This is the one
  behavior change that arrives with the bump; it is announced as breaking because a
  config that previously "worked" (silently ignored) now fails loudly.
- ConfigFields for archive_dir/db_path enable unknown-key rejection (catches typos
  like archve_dir that were silently dropped).
- Per-flag ConflictMode("error") on archive-dir/db-path makes a diverging CLI vs
  config value a conflict; identical values are still accepted (divergence-aware).
  exclude-env-patterns stays cli-wins (it is a list; ConfigField supports scalars only).

Config-layer failures exit 1 (strictcli's layer); saferm's own semantic conflicts
remain exit 7. SAFERM_HOME stays infrastructure, not config, and is not suppressed
by --hermetic.
"""
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go", "npm", "pypi"]
exclude = []
release_commit = "3be3afd6b9fd1a17f0ca563ac08872f57fd40271"

[released_trees]
"." = "88a2ca5562ef5a9f1bd8b188769174eb6b57189d"
