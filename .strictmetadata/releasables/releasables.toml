format_version = 1
repository_layout = "standalone"
release_branches = ["main", "master"]

[timeouts]
push_seconds = 120

[[releasables]]
name = "saferm"
tag_format = "v{version}"
publish_mode = "ci"

[[members]]
path = "."
name = "root"
description = "The `rm` replacement that is safe to hand to your AI Agents: deleted files can be restored, know exactly which session deleted a file, when, and why, with the reason being a required flag"
releasable = "saferm"
targets = [{ name = "go" }, { name = "npm", path = "npm" }, { name = "pypi", path = "pypi" }]

[[members.pipelines]]
name = "go"
type = "go"
target = "go"
local = false
artifact = "binary"
install_paths = ["."]
homebrew_tap = "homebrew-tap"

[[members.pipelines]]
name = "npm"
type = "npm"
target = "npm"
local = false
artifact = "go-binary"
binary_pipeline = "go"

[[members.pipelines]]
name = "pypi"
type = "pypi"
target = "pypi"
local = false
artifact = "go-binary"
binary_pipeline = "go"
