name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3). Overrides the ref for retry dispatch."
        required: false
        type: string

# One publish run per tag: a workflow_dispatch retry at the same tag
# queues behind the in-flight run instead of racing it. A publish is never
# cancelled mid-flight.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  wait-for-ci:
    name: Wait for CI on the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WAIT_TIMEOUT_MINUTES: "20"
      WAIT_GRACE_MINUTES: "5"
      WAIT_POLL_SECONDS: "15"
      MARKER_ATTEMPTS: "5"
      MARKER_RETRY_SECONDS: "5"
      CI_CHECK_PATTERN: '^(test)( \(.*\))?$'
    steps:
      - name: Wait for CI to succeed on the release commit
        run: |
          set -euo pipefail

          # The release commit: the rlsbl-ci-sha marker in the Release body when it is
          # there (read MARKER_ATTEMPTS times, MARKER_RETRY_SECONDS apart, since a new
          # Release can lag on GitHub's read replicas), else GITHUB_SHA, the tagged
          # commit for a release event and for a dispatch at the tag alike. The tag is
          # the dispatch's tag input when one was given (TAG_INPUT), else the ref.
          extract_ci_sha() {
            sed -n 's/.*<!-- rlsbl-ci-sha: \([0-9a-f]\{40\}\) -->.*/\1/p' | head -n1
          }
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          sha=""
          attempt=1
          while [ "$attempt" -le "$MARKER_ATTEMPTS" ]; do
            if body="$(gh release view "$tag" --json body --jq .body 2>/dev/null)"; then
              sha="$(printf '%s\n' "$body" | extract_ci_sha)"
            fi
            if [ -n "$sha" ]; then
              break
            fi
            if [ "$attempt" -lt "$MARKER_ATTEMPTS" ]; then
              echo "wait-for-ci: the rlsbl-ci-sha marker is not visible in the '$tag' Release body yet (attempt $attempt/$MARKER_ATTEMPTS); reading it again in ${MARKER_RETRY_SECONDS}s"
              sleep "$MARKER_RETRY_SECONDS"
            fi
            attempt=$(( attempt + 1 ))
          done
          if [ -n "$sha" ]; then
            echo "wait-for-ci: the release commit is the one the rlsbl-ci-sha marker of the '$tag' Release names."
          else
            sha="$GITHUB_SHA"
            echo "wait-for-ci: no rlsbl-ci-sha marker in the '$tag' Release body after $MARKER_ATTEMPTS reads; the release commit is GITHUB_SHA."
          fi
          echo "wait-for-ci: waiting for CI on $tag (commit $sha)"
          echo "Check-run name pattern: $CI_CHECK_PATTERN"
          # The limits are this job's env. Raising WAIT_TIMEOUT_MINUTES needs the job's
          # timeout-minutes raised with it, or GitHub cancels the job first.

          now() { date +%s; }
          start="$(now)"
          deadline=$(( start + WAIT_TIMEOUT_MINUTES * 60 ))
          grace_deadline=$(( start + WAIT_GRACE_MINUTES * 60 ))

          while :; do
            if ! resp="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"; then
              if [ "$(now)" -ge "$deadline" ]; then
                echo "::error::wait-for-ci: the checks API request for $sha kept failing for $WAIT_TIMEOUT_MINUTES minutes."
                echo "Without the check runs nothing says whether CI passed, so the publish is refused."
                echo "Check the API response above and this job's checks: read permission, then dispatch this publish workflow again at the tag: gh workflow run <publish workflow> --ref $tag"
                exit 1
              fi
              echo "The checks API request failed; asking again in ${WAIT_POLL_SECONDS}s"
              sleep "$WAIT_POLL_SECONDS"
              continue
            fi
            # This project's check runs, minus this workflow run's own jobs. Same-named
            # check runs collapse to the newest (started_at, then id), except that a
            # skipped one gives way to the newest completed check run of the same name
            # that is not skipped (a run_all dispatch of the CI router puts a
            # verdict beside the push run's skip, often recorded earlier). Then a skip
            # is dropped when a completed, unskipped matrix entry of the same job exists
            # ("name (...)"), since GitHub records a skipped matrix job under the bare
            # name. Nothing else covers a skip.
            runs="$(jq -s --arg re "$CI_CHECK_PATTERN" --arg run_id "$GITHUB_RUN_ID" '
              [ .[].check_runs[]
                | select(.name | test($re))
                | select((.details_url // "") | contains("/actions/runs/" + $run_id + "/") | not)
                | {name, status, conclusion, id, started_at} ]
              | group_by(.name)
              | map(
                  . as $g
                  | ($g | sort_by(.started_at, .id) | last) as $newest
                  | (if $newest.conclusion == "skipped"
                     then ([ $g[] | select(.status == "completed" and .conclusion != "skipped") ]
                           | sort_by(.started_at, .id) | last // $newest)
                     else $newest end))
              | . as $latest
              | map(. as $c
                  | select(
                      $c.conclusion != "skipped"
                      or ([ $latest[]
                            | select((.name | startswith($c.name + " ("))
                                     and .status == "completed"
                                     and .conclusion != "skipped") ]
                          | length) == 0))' <<< "$resp")"
            total="$(jq 'length' <<< "$runs")"

            if [ "$total" -eq 0 ]; then
              if [ "$(now)" -ge "$grace_deadline" ]; then
                echo "::error::wait-for-ci: no CI check run matching $CI_CHECK_PATTERN appeared on $sha within $WAIT_GRACE_MINUTES minutes."
                echo "rlsbl tags a commit only after its CI ran on it, so the check runs must be there."
                echo "They are missing when the check runs were deleted, the release commit was resolved wrongly, or the tag was created outside rlsbl."
                echo "When the CI jobs were renamed, change CI_CHECK_PATTERN in this job to match the new names."
                exit 1
              fi
              echo "No matching CI check run yet; asking again in ${WAIT_POLL_SECONDS}s"
              sleep "$WAIT_POLL_SECONDS"
              continue
            fi

            pending="$(jq '[ .[] | select(.status != "completed") ] | length' <<< "$runs")"
            if [ "$pending" -gt 0 ]; then
              if [ "$(now)" -ge "$deadline" ]; then
                echo "::error::wait-for-ci: CI did not complete on $sha within $WAIT_TIMEOUT_MINUTES minutes."
                jq -r '.[] | "  \(.name): status=\(.status) conclusion=\(.conclusion // "none")"' <<< "$runs"
                exit 1
              fi
              echo "$pending of $total matching CI check runs still running; asking again in ${WAIT_POLL_SECONDS}s"
              sleep "$WAIT_POLL_SECONDS"
              continue
            fi

            not_success="$(jq '[ .[] | select(.conclusion != "success") ]' <<< "$runs")"
            if [ "$(jq 'length' <<< "$not_success")" -gt 0 ]; then
              echo "::error::wait-for-ci: CI did not pass on $sha, so nothing is published."
              jq -r '.[] | "  \(.name): \(.conclusion)"' <<< "$not_success"
              while IFS= read -r conclusion; do
                case "$conclusion" in
                  failure|timed_out)
                    echo "CI concluded '$conclusion' on the release commit."
                    echo "rlsbl tags and releases a commit only after its CI went green, so CI was run again on a released commit and failed, a required check was added after the release, or the tag and Release were created outside rlsbl."
                    echo "Dispatching this workflow again gives the same answer: the failure is in the code at this commit."
                    echo "Fix it on the release branch, release a new version with 'rlsbl release run --watch', and mark this one with 'rlsbl release deprecate'."
                    ;;
                  cancelled)
                    echo "A CI check run was cancelled, which proves nothing about the commit."
                    echo "Run that CI workflow again on this commit (gh run rerun <run-id>); when it passes, dispatch this workflow again at the tag: gh workflow run <publish workflow> --ref $tag"
                    ;;
                  skipped)
                    echo "A CI check run matching the pattern was skipped: this project must run its own CI on the release commit."
                    echo "Check the path filters and job conditions that skipped it, run CI on this commit again, then dispatch this workflow again at the tag."
                    ;;
                  *)
                    echo "A CI check run concluded '$conclusion'; only success lets the publish go on."
                    ;;
                esac
              done <<< "$(jq -r '.[].conclusion' <<< "$not_success" | sort -u)"
              exit 1
            fi

            echo "wait-for-ci: all $total matching CI check runs succeeded."
            jq -r '.[] | "  \(.name): \(.conclusion)"' <<< "$runs"
            exit 0
          done
  go:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      - name: Check if already published
        id: check-go
        run: |
          TAG="${RELEASE_TAG}"
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            # Tag already pushed and goreleaser assets likely exist
            RELEASE_ASSETS=$(gh release view "${TAG}" --json assets -q '.assets | length' 2>/dev/null || echo "0")
            if [ "${RELEASE_ASSETS}" -gt 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Already published: ${TAG} (${RELEASE_ASSETS} assets)"
            fi
          fi
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # rlsbl owns the release, goreleaser only BUILDS.
      #
      # goreleaser's publisher cannot target a prefixed tag ("<name>@v1.2.3"):
      # its tag validation rejects the prefix, and with --skip=validate its
      # release lookup still resolves the stripped bare name and would create
      # or append to a `v1.2.3` Release nothing reads. So the archives are
      # built here and attached to the Release rlsbl already created.
      - name: Derive the bare version tag for goreleaser
        id: bare-tag
        if: steps.check-go.outputs.skip != 'true'
        run: |
          # Strip any "<name>@" / "<path>/" prefix: keep the trailing vX.Y.Z.
          BARE=$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^.*(v[0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')
          echo "tag=${BARE}" >> "$GITHUB_OUTPUT"
          # goreleaser reads GORELEASER_CURRENT_TAG's tag contents while getting
          # git state, BEFORE --skip=validate can excuse anything, so a name no
          # tag carries aborts the run. A repository whose tags are prefixed
          # carries no bare tag, so create the bare one locally at the released
          # commit. It is a lightweight tag (an annotated one needs a tagger
          # identity no CI checkout sets) and nothing pushes it: goreleaser runs
          # --skip=publish, and the upload step below attaches the archives to
          # the prefixed tag. In a repository whose tags are already bare this
          # does nothing.
          if ! git rev-parse -q --verify "refs/tags/${BARE}" >/dev/null; then
            git tag "${BARE}" "$(git rev-parse HEAD)"
          fi
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - uses: goreleaser/goreleaser-action@v7.2.3
        if: steps.check-go.outputs.skip != 'true'
        with:
          # Pinned from rlsbl's action-version table. A floating "~> v2"
          # silently adopts each new goreleaser on the next release: 2.18.1
          # arrived that way and broke every prefixed-tag repository.
          version: v2.18.1
          args: release --clean --skip=publish,announce,validate
        env:
          # A prefixed tag is not parseable as a version, and validation would
          # compare the stripped tag against a git tag that does not exist.
          GORELEASER_CURRENT_TAG: ${{ steps.bare-tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Scan artifacts for secrets
        # Scoped to what goreleaser just built and is about to upload. A
        # whole-tree scan flags files that never ship (fixtures, docs, sample
        # configs, public identifiers) and has blocked a release mid-flight.
        # gitleaks only auto-loads .gitleaks.toml from the directory it scans,
        # so the project's allowlist is passed explicitly.
        if: steps.check-go.outputs.skip != 'true'
        run: |
          CONFIG_ARGS=""
          if [ -f .gitleaks.toml ]; then
            CONFIG_ARGS="--config ${PWD}/.gitleaks.toml"
          fi
          gitleaks dir dist/ ${CONFIG_ARGS}
      - name: Upload release assets to the release tag
        if: steps.check-go.outputs.skip != 'true'
        run: |
          # dist/ holds the archives plus checksums.txt. --clobber keeps a
          # re-dispatch at the same tag idempotent.
          shopt -s nullglob
          ASSETS=(dist/*.tar.gz dist/checksums.txt)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::goreleaser produced no assets in dist/"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm-linux-x64:
    name: Publish the npm package saferemove-linux-x64
    needs: [wait-for-ci, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pack and publish saferemove-linux-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            'v'*'') ;;
            *) echo "::error::the tag $RELEASE_TAG is not one of this releasable's tags (v<version>)"; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#'v'}"
          VERSION="${VERSION%''}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag $RELEASE_TAG carries the version '$VERSION', which is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          work="$RUNNER_TEMP/npm-linux-x64"
          mkdir -p "$work/archive"
          gh release download "$RELEASE_TAG" --pattern "saferm_${VERSION}_linux_amd64.tar.gz" --dir "$work/archive"
          tar -xzf "$work/archive/saferm_${VERSION}_linux_amd64.tar.gz" -C "$work/archive" 'saferm'
          mkdir -p "$work/package"
          install -m 0755 "$work/archive/saferm" "$work/package/saferm"
          sed "s/@VERSION@/$VERSION/" > "$work/package/package.json" <<'MANIFEST'
          {
            "cpu": [
              "x64"
            ],
            "description": "The saferm binary of saferemove for linux x64",
            "files": [
              "saferm"
            ],
            "license": "MIT",
            "name": "saferemove-linux-x64",
            "os": [
              "linux"
            ],
            "repository": {
              "type": "git",
              "url": "https://github.com/stricttools/saferm"
            },
            "version": "@VERSION@"
          }
          MANIFEST
          published() {
            if out="$(npm view "$1" versions --json 2>&1)"; then
              printf '%s' "$out" | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { const v = JSON.parse(s); process.exit((Array.isArray(v) ? v : [v]).includes(process.argv[1]) ? 0 : 1); });' "$2"
              return
            fi
            case "$out" in
              *E404*) return 1 ;;
            esac
            echo "::error::npm could not list the published versions of $1: $out"
            exit 1
          }
          if published 'saferemove-linux-x64' "$VERSION"; then
            echo "saferemove-linux-x64@$VERSION is published already"
          else
            (cd "$work/package" && npm publish --access public --provenance)
          fi
