  npm-package:
    name: Publish the npm package saferemove
    needs: [wait-for-ci, npm-linux-x64, npm-linux-arm64, npm-darwin-x64, npm-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin the platform packages and publish saferemove
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            'v'*'') ;;
            *) echo "::error::the tag $RELEASE_TAG is not one of this releasable's tags (v<version>)"; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#'v'}"
          VERSION="${VERSION%''}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag $RELEASE_TAG carries the version '$VERSION', which is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          cd 'npm'
          node -e "$(cat <<'STAMP'
          const fs = require("fs");
          const version = process.argv[1];
          const name = "saferemove";
          const platforms = ["saferemove-darwin-arm64","saferemove-darwin-x64","saferemove-linux-arm64","saferemove-linux-x64"];
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const fail = (m) => { console.log("::error::" + m); process.exit(1); };
          if (pkg.name !== name) fail("package.json names the package " + pkg.name + ", not " + name);
          if (pkg.version !== version) fail("package.json carries the version " + pkg.version + ", not the released " + version);
          for (const s of ["preinstall", "install", "postinstall"]) { if (pkg.scripts && pkg.scripts[s]) fail("package.json declares a " + s + " script; the package selects its platform package through optionalDependencies and runs nothing at install"); }
          pkg.optionalDependencies = Object.assign({}, pkg.optionalDependencies);
          for (const p of platforms) pkg.optionalDependencies[p] = version;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          STAMP
          )" "$VERSION"
          published() {
            if out="$(npm view "$1" versions --json 2>&1)"; then
              printf '%s' "$out" | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { const v = JSON.parse(s); process.exit((Array.isArray(v) ? v : [v]).includes(process.argv[1]) ? 0 : 1); });' "$2"
              return
            fi
            case "$out" in
              *E404*) return 1 ;;
            esac
            echo "::error::npm could not list the published versions of $1: $out"
            exit 1
          }
          if published 'saferemove' "$VERSION"; then
            echo "saferemove@$VERSION is published already"
          else
            npm publish --access public --provenance
          fi
  pypi-wheels:
    name: Publish the PyPI binary wheels
    needs: [wait-for-ci, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Assemble one binary wheel per platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            'v'*'') ;;
            *) echo "::error::the tag $RELEASE_TAG is not one of this releasable's tags (v<version>)"; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#'v'}"
          VERSION="${VERSION%''}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag $RELEASE_TAG carries the version '$VERSION', which is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ -d dist ] && [ -n "$(ls -A dist)" ]; then
            echo "::error::dist/ is not empty at the tag; the wheels are published from it, so it must hold nothing else"
            exit 1
          fi
          out="$PWD/dist"
          meta="$RUNNER_TEMP/wheel-metadata"
          mkdir -p "$out" "$meta"
          python3 - 'pypi/pyproject.toml' "$VERSION" "$meta" <<'METADATA'
          import os, sys, tomllib
          path, version, out = sys.argv[1:4]
          with open(path, "rb") as f:
              project = tomllib.load(f).get("project")
          if not isinstance(project, dict):
              sys.exit(f"::error::{path} has no [project] table")
          name = project.get("name")
          if not isinstance(name, str) or not name:
              sys.exit(f"::error::{path} declares no project name")
          if project.get("version") != version:
              sys.exit(f"::error::{path} carries the version {project.get('version')!r}, not the released {version}")
          lines = ["Metadata-Version: 2.4", f"Name: {name}", f"Version: {version}"]
          description = project.get("description")
          if description:
              lines.append(f"Summary: {description}")
          license = project.get("license")
          if isinstance(license, str):
              lines.append(f"License-Expression: {license}")
          elif license is not None:
              sys.exit(f"::error::{path} declares its license as a table; write it as an SPDX expression string")
          for label, url in (project.get("urls") or {}).items():
              lines.append(f"Project-URL: {label}, {url}")
          keywords = project.get("keywords")
          if keywords:
              lines.append("Keywords: " + ",".join(keywords))
          for classifier in project.get("classifiers") or []:
              lines.append(f"Classifier: {classifier}")
          body = ""
          readme = project.get("readme")
          if readme is not None:
              types = {".md": "text/markdown", ".rst": "text/x-rst", ".txt": "text/plain"}
              if isinstance(readme, str):
                  file, text = readme, None
                  content_type = types.get(os.path.splitext(readme)[1].lower())
                  if content_type is None:
                      sys.exit(f"::error::{path} names the readme {readme}, whose suffix is none of {', '.join(types)}; write readme as a table with its content-type")
              else:
                  file, text, content_type = readme.get("file"), readme.get("text"), readme.get("content-type")
                  if not content_type:
                      sys.exit(f"::error::{path} declares its readme as a table without a content-type")
              if text is None:
                  readme_path = os.path.join(os.path.dirname(path), file)
                  try:
                      with open(readme_path, encoding="utf-8") as f:
                          text = f.read()
                  except OSError as e:
                      sys.exit(f"::error::{path} names the readme {file}, which cannot be read: {e}")
              lines.append(f"Description-Content-Type: {content_type}")
              body = "\n" + text
          with open(out + "/METADATA", "w") as f:
              f.write("\n".join(lines) + "\n" + body)
          with open(out + "/name", "w") as f:
              f.write(name)
          METADATA
          dist="$(tr 'A-Z' 'a-z' < "$meta/name" | sed -E 's/[-_.]+/_/g')"
          write_record() {
            record="$1/$2/RECORD"
            : > "$record"
            (cd "$1" && find . -type f ! -path "./$2/RECORD" | sed 's|^\./||' | LC_ALL=C sort) | while IFS= read -r f; do
              hex="$(sha256sum "$1/$f" | cut -d' ' -f1)"
              digest="$(printf '%b' "$(printf '%s' "$hex" | sed 's/../\\x&/g')" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
              size="$(wc -c < "$1/$f" | tr -d ' ')"
              printf '%s,sha256=%s,%s\n' "$f" "$digest" "$size" >> "$record"
            done
            printf '%s/RECORD,,\n' "$2" >> "$record"
          }
          # linux-x64
          work="$RUNNER_TEMP/wheel-linux-x64"
          mkdir -p "$work/archive"
          gh release download "$RELEASE_TAG" --pattern "saferm_${VERSION}_linux_amd64.tar.gz" --dir "$work/archive"
          tar -xzf "$work/archive/saferm_${VERSION}_linux_amd64.tar.gz" -C "$work/archive" 'saferm'
          tree="$work/tree"
          mkdir -p "$tree/${dist}-${VERSION}.data/scripts" "$tree/${dist}-${VERSION}.dist-info"
          install -m 0755 "$work/archive/saferm" "$tree/${dist}-${VERSION}.data/scripts/saferm"
          cp "$meta/METADATA" "$tree/${dist}-${VERSION}.dist-info/METADATA"
          printf '%s\n' 'Wheel-Version: 1.0' 'Generator: rlsbl' 'Root-Is-Purelib: false' 'Tag: py3-none-manylinux_2_17_x86_64' 'Tag: py3-none-manylinux2014_x86_64' 'Tag: py3-none-musllinux_1_1_x86_64' > "$tree/${dist}-${VERSION}.dist-info/WHEEL"
          write_record "$tree" "${dist}-${VERSION}.dist-info"
          (cd "$tree" && zip -q -X -D -r "$out/${dist}-${VERSION}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64.whl" .)
          # linux-arm64
          work="$RUNNER_TEMP/wheel-linux-arm64"
          mkdir -p "$work/archive"
          gh release download "$RELEASE_TAG" --pattern "saferm_${VERSION}_linux_arm64.tar.gz" --dir "$work/archive"
          tar -xzf "$work/archive/saferm_${VERSION}_linux_arm64.tar.gz" -C "$work/archive" 'saferm'
          tree="$work/tree"
          mkdir -p "$tree/${dist}-${VERSION}.data/scripts" "$tree/${dist}-${VERSION}.dist-info"
          install -m 0755 "$work/archive/saferm" "$tree/${dist}-${VERSION}.data/scripts/saferm"
          cp "$meta/METADATA" "$tree/${dist}-${VERSION}.dist-info/METADATA"
          printf '%s\n' 'Wheel-Version: 1.0' 'Generator: rlsbl' 'Root-Is-Purelib: false' 'Tag: py3-none-manylinux_2_17_aarch64' 'Tag: py3-none-manylinux2014_aarch64' 'Tag: py3-none-musllinux_1_1_aarch64' > "$tree/${dist}-${VERSION}.dist-info/WHEEL"
          write_record "$tree" "${dist}-${VERSION}.dist-info"
          (cd "$tree" && zip -q -X -D -r "$out/${dist}-${VERSION}-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl" .)
          # darwin-x64
          work="$RUNNER_TEMP/wheel-darwin-x64"
          mkdir -p "$work/archive"
          gh release download "$RELEASE_TAG" --pattern "saferm_${VERSION}_darwin_amd64.tar.gz" --dir "$work/archive"
          tar -xzf "$work/archive/saferm_${VERSION}_darwin_amd64.tar.gz" -C "$work/archive" 'saferm'
          tree="$work/tree"
          mkdir -p "$tree/${dist}-${VERSION}.data/scripts" "$tree/${dist}-${VERSION}.dist-info"
          install -m 0755 "$work/archive/saferm" "$tree/${dist}-${VERSION}.data/scripts/saferm"
          cp "$meta/METADATA" "$tree/${dist}-${VERSION}.dist-info/METADATA"
          printf '%s\n' 'Wheel-Version: 1.0' 'Generator: rlsbl' 'Root-Is-Purelib: false' 'Tag: py3-none-macosx_10_12_x86_64' > "$tree/${dist}-${VERSION}.dist-info/WHEEL"
          write_record "$tree" "${dist}-${VERSION}.dist-info"
          (cd "$tree" && zip -q -X -D -r "$out/${dist}-${VERSION}-py3-none-macosx_10_12_x86_64.whl" .)
          # darwin-arm64
          work="$RUNNER_TEMP/wheel-darwin-arm64"
          mkdir -p "$work/archive"
          gh release download "$RELEASE_TAG" --pattern "saferm_${VERSION}_darwin_arm64.tar.gz" --dir "$work/archive"
          tar -xzf "$work/archive/saferm_${VERSION}_darwin_arm64.tar.gz" -C "$work/archive" 'saferm'
          tree="$work/tree"
          mkdir -p "$tree/${dist}-${VERSION}.data/scripts" "$tree/${dist}-${VERSION}.dist-info"
          install -m 0755 "$work/archive/saferm" "$tree/${dist}-${VERSION}.data/scripts/saferm"
          cp "$meta/METADATA" "$tree/${dist}-${VERSION}.dist-info/METADATA"
          printf '%s\n' 'Wheel-Version: 1.0' 'Generator: rlsbl' 'Root-Is-Purelib: false' 'Tag: py3-none-macosx_11_0_arm64' > "$tree/${dist}-${VERSION}.dist-info/WHEEL"
          write_record "$tree" "${dist}-${VERSION}.dist-info"
          (cd "$tree" && zip -q -X -D -r "$out/${dist}-${VERSION}-py3-none-macosx_11_0_arm64.whl" .)
          ls -l "$out"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
